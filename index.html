<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>To-Do List Interaktif</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>To-Do List</h1>
    <p class="subtitle">Klik teks tugas untuk menandainya selesai.</p>

    <section class="stats">
      <div class="stat"><strong id="stat-total">0</strong><span>Total</span></div>
      <div class="stat"><strong id="stat-selesai">0</strong><span>Selesai</span></div>
      <div class="stat"><strong id="stat-belum">0</strong><span>Belum Selesai</span></div>
    </section>

    <div class="input-row">
      <input type="text" id="input-tugas" placeholder="Tulis tugas baru..." autocomplete="off">
      <button id="btn-tambah" type="button">Tambah</button>
    </div>
    <div id="peringatan"></div>

    <ul id="daftar"></ul>
  </main>

<script src="app.js"></script>
</body>
</html>
